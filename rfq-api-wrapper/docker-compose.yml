version: '3.8'

services:
  rfq-api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    restart: always
    command: ["bun", "run", "start"]

  maker-bot:
    build: .
    env_file: .env
    restart: always
    command: ["bun", "run", "maker"]

  filler-bot:
    build: .
    env_file: .env
    restart: always
    command: ["bun", "run", "filler"]

  arb-bot:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["bun", "run", "bot", "spatial", "8453"]

  liquidation-bot:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["bun", "run", "bot", "liquidate", "8453"]

  mirror-bot:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["bun", "run", "bot", "mirror", "8453"]

  multi-bot:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["bun", "run", "bot", "spatial,liquidate,mirror", "8453"]
